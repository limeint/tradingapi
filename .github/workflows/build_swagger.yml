name: Build Swagger
on:
  push:
    branches: [ "main" ]
    paths:
      - 'proto/grpc/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Install protoc-gen-openapiv2
        shell: bash
        run: go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v2.27.3

      - name: Add GOPATH/bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3

      - name: Generate Swagger from proto/grpc
        shell: bash
        run: |
          set -euo pipefail
          PROTO_DIR="proto/grpc"
          # Collect all .proto files under proto/grpc
          mapfile -t PROTOS < <(find "$PROTO_DIR" -type f -name "*.proto" | sort)
          if [ ${#PROTOS[@]} -eq 0 ]; then
            echo "No .proto files found under $PROTO_DIR. Nothing to do."
            exit 0
          fi

          # Run protoc with protoc-gen-openapiv2, merging all services into
          # a single docs/swagger/api.swagger.json
          protoc \
            --proto_path=proto \
            --openapiv2_out=docs/swagger \
            --openapiv2_opt=logtostderr=true,allow_merge=true,merge_file_name=api,json_names_for_fields=false \
            "${PROTOS[@]}"

      - name: Commit and push generated files
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only generated outputs
          git add docs/swagger/api.swagger.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-generate Swagger from proto/grpc"
          git push
