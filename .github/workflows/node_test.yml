name: Node SDK CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'sdk/node/**'
      - 'examples/sdk/node/**'
      - 'examples/strategies/sma_crossover/node/**'
      - 'proto/**'
      - '.github/workflows/node_test.yml'
  pull_request:
    paths:
      - 'sdk/node/**'
      - 'examples/sdk/node/**'
      - 'examples/strategies/sma_crossover/node/**'
      - 'proto/**'
      - '.github/workflows/node_test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    defaults:
      run:
        working-directory: sdk/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check, and test
        run: npm run check

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check focused examples against this SDK
        if: matrix.node-version == 20
        working-directory: examples/sdk/node
        run: |
          npm ci
          npm install --no-save ../../../sdk/node
          npm run check

      - name: Check strategy against this SDK
        if: matrix.node-version == 20
        working-directory: examples/strategies/sma_crossover/node
        run: |
          npm ci
          npm install --no-save ../../../../sdk/node
          npm run check
