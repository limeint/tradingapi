name: Node SDK CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'sdk/node/**'
      - 'proto/**'
      - '.github/workflows/node_test.yml'
  pull_request:
    paths:
      - 'sdk/node/**'
      - 'proto/**'
      - '.github/workflows/node_test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    defaults:
      run:
        working-directory: sdk/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate proto stubs
        run: npm run generate

      - name: Verify generated files are current
        run: git diff --exit-code -- src/generated

      - name: Type-check SDK, tests, and examples
        run: npm run typecheck

      - name: Run integration tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run
