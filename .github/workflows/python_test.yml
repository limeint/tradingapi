name: Python SDK CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'sdk/python/**'
      - 'proto/**'
      - 'strategies/sma_crossover/python/**'
      - '.github/workflows/python_test.yml'
  pull_request:
    paths:
      - 'sdk/python/**'
      - 'proto/**'
      - 'strategies/sma_crossover/python/**'
      - '.github/workflows/python_test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: sdk/python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Regenerate proto stubs
        run: ./scripts/generate_proto.sh

      - name: Lint with ruff
        # Warn-only for the first releases — tighten to `ruff check` once
        # the pre-existing warnings have been triaged.
        continue-on-error: true
        run: ruff check trade_api/ examples/ tests/

      - name: Type-check with pyright
        # Same rationale as ruff. Run only on the latest matrix version to
        # avoid noise from version-specific typeshed differences.
        if: matrix.python-version == '3.13'
        continue-on-error: true
        run: |
          python -m pip install pyright
          pyright trade_api/ examples/

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=trade_api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95

      - name: Smoke-import examples
        # Catches example bitrot — e.g. an imported message that no longer
        # exists, or a stale call signature. Examples need env vars at run
        # time but should import cleanly without them.
        env:
          TRADE_API_SECRET: ''
          TRADE_API_ACCOUNT_ID: ''
        run: |
          for f in examples/*.py; do
            python -c "
          import ast, sys
          src = open('$f').read()
          ast.parse(src)  # syntax
          # Replace the __main__ guard execution by parsing only; importing
          # the module file would try to read env vars at import time. Some
          # examples do that (auth_and_account.py uses os.environ['TRADE_API_SECRET']
          # inside main()), so the AST parse is the right level of smoke test.
          print('OK:', '$f')
          "
          done

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: sdk/python/coverage.xml
          if-no-files-found: error

  build:
    # Verifies the package builds, the wheel/sdist are well-formed, and the
    # metadata is publishable. Runs once (not across the matrix) — packaging
    # output doesn't depend on the Python version used to build it.
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: sdk/python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Install proto generation tooling
        run: python -m pip install -e ".[dev]"

      - name: Regenerate proto stubs
        run: ./scripts/generate_proto.sh

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distribution metadata
        # `twine check` catches issues PyPI would reject — bad README rendering,
        # missing classifiers, malformed license fields, etc.
        run: twine check --strict dist/*

      - name: Verify distribution contents
        run: python scripts/verify_distribution.py dist

      - name: Smoke-test the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/limeint-sdk-smoke"
          "$RUNNER_TEMP/limeint-sdk-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/limeint-sdk-smoke/bin/python" -c \
            "from trade_api import TradeAPIClient; from trade_api.market_data import BarsRequest; print('wheel import passed')"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: sdk/python/dist/*
          if-no-files-found: error
          retention-days: 30

  wheel-test:
    name: Wheel test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Install and import the built wheel
        run: |
          python -m pip install dist/*.whl
          python -c \
            "from trade_api import TradeAPIClient; from trade_api.market_data import BarsRequest; print('wheel import passed')"

  strategy-test:
    name: Strategy test against installed SDK wheel
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: strategies/sma_crossover/python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            strategies/sma_crossover/python/requirements.txt
            strategies/sma_crossover/python/requirements-dev.txt

      - name: Download SDK distribution
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: ${{ runner.temp }}/python-dist

      - name: Install the SDK wheel and strategy dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$RUNNER_TEMP"/python-dist/*.whl
          python -m pip install -r requirements-dev.txt

      - name: Verify the strategy is not importing repository SDK source
        env:
          REPOSITORY_SDK_SOURCE: ${{ github.workspace }}/sdk/python
        run: |
          python -c "
          import os
          from pathlib import Path
          import trade_api

          package_path = Path(trade_api.__file__).resolve()
          source_path = Path(os.environ['REPOSITORY_SDK_SOURCE']).resolve()
          if package_path.is_relative_to(source_path):
              raise SystemExit(f'strategy imported repository SDK source: {package_path}')
          print(f'strategy uses installed SDK: {package_path}')
          "

      - name: Test and lint the strategy
        run: |
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy .
