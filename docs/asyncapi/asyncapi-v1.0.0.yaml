asyncapi: "3.0.0"
info:
  title: Limeint Trade API (WebSocket)
  version: "1.0.0"
  description: |
    WebSocket subscriptions for quotes, trades, order book, bars, orders, and account updates.
    The client sends requests (subscribe/unsubscribe/unsubscribe_all) as JSON, and the server
    replies with envelopes:
    - DATA — payload with data for the different subscription types (BARS, ORDER_BOOK, QUOTES,
      TRADES, ORDERS, ACCOUNT)
    - ERROR — an error (validation, authentication, upstream unavailability, etc.)
    - EVENT — service events (HANDSHAKE_SUCCESS, CONNECTION_CLOSED, etc.)

servers:
  production:
    host: "api.limeint.eu:443"
    protocol: "wss"
    description: Production WebSocket host
    security:
      - $ref: "#/components/securitySchemes/AuthorizationHeader"
      - $ref: "#/components/securitySchemes/TokenInPayload"

channels:
  tradingInfo:
    address: "/ws"
    summary: WebSocket channel for subscribing to market data by instrument and to account data
    messages:
      wsRequest:
        $ref: "#/components/messages/wsRequest"
      wsEnvelope:
        $ref: "#/components/messages/wsEnvelope"

operations:
  sendRequest:
    action: send
    channel:
      $ref: "#/channels/tradingInfo"
    summary: "Client sends SUBSCRIBE/UNSUBSCRIBE/UNSUBSCRIBE_ALL commands"
    messages:
      - $ref: "#/channels/tradingInfo/messages/wsRequest"
  envelopeListener:
    action: receive
    channel:
      $ref: "#/channels/tradingInfo"
    summary: "Client receives data for its subscriptions, plus service events and errors"
    messages:
      - $ref: "#/channels/tradingInfo/messages/wsEnvelope"


components:

  messages:
    wsRequest:
      name: WsRequest
      summary: "Client request to subscribe/unsubscribe"
      payload:
        type: object
        required:
          - action
          - token
        properties:
          action:
            type: string
            enum:
              - SUBSCRIBE
              - UNSUBSCRIBE
              - UNSUBSCRIBE_ALL
            description: "Action"
          type:
            $ref: "#/components/schemas/SubscriptionType"
            description: "Subscription type (required for SUBSCRIBE/UNSUBSCRIBE)"
          data:
            type: object
            description: "Request data. Structure depends on the subscription type. See examples."
          token:
            type: string
            description: "A valid JWT"
      examples:
        - name: SubscribeBars
          summary: "Subscribe to aggregated bars"
          payload:
            action: SUBSCRIBE
            type: BARS
            data:
              symbol: "AAPL@XNGS"
              timeframe: TIME_FRAME_D
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: UnsubscribeBars
          summary: "Close the aggregated-bars subscription"
          payload:
            action: UNSUBSCRIBE
            type: BARS
            data:
              symbol: "AAPL@XNGS"
              timeframe: TIME_FRAME_D
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: SubscribeOrderBook
          summary: "Subscribe to an instrument's order book"
          payload:
            action: SUBSCRIBE
            type: ORDER_BOOK
            data:
              symbol: "AAPL@XNGS"
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: UnsubscribeOrderBook
          summary: "Close the order-book subscription"
          payload:
            action: UNSUBSCRIBE
            type: ORDER_BOOK
            data:
              symbol: "AAPL@XNGS"
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: SubscribeQuotes
          summary: "Subscribe to quotes for instruments"
          payload:
            action: SUBSCRIBE
            type: QUOTES
            data:
              symbols: [ "AAPL@XNGS", "MSFT@XNGS" ]
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: UnsubscribeQuotes
          summary: "Close the quotes subscription for instruments"
          payload:
            action: UNSUBSCRIBE
            type: QUOTES
            data:
              symbols: [ "AAPL@XNGS", "MSFT@XNGS" ]
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: SubscribeLatestTrades
          summary: "Subscribe to trades for an instrument"
          payload:
            action: SUBSCRIBE
            type: INSTRUMENT_TRADES
            data:
              symbol: "AAPL@XNGS"
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: UnsubscribeLatestTrades
          summary: "Close the instrument-trades subscription"
          payload:
            action: UNSUBSCRIBE
            type: INSTRUMENT_TRADES
            data:
              symbol: "AAPL@XNGS"
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: SubscribeOrders
          summary: "Subscribe to orders for an account"
          payload:
            action: SUBSCRIBE
            type: ORDERS
            data:
              account_id: "1812243"
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: UnsubscribeOrders
          summary: "Close the orders subscription for an account"
          payload:
            action: UNSUBSCRIBE
            type: ORDERS
            data:
              account_id: "1812243"
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: SubscribeTrades
          summary: "Subscribe to trades for an account"
          payload:
            action: SUBSCRIBE
            type: TRADES
            data:
              account_id: "1812243"
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: UnsubscribeTrades
          summary: "Close the trades subscription for an account"
          payload:
            action: UNSUBSCRIBE
            type: TRADES
            data:
              account_id: "1812243"
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: SubscribeAccount
          summary: "Subscribe to portfolio changes"
          payload:
            action: SUBSCRIBE
            type: ACCOUNT
            data:
              account_id: "1812243"
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: UnsubscribeAccount
          summary: "Close the portfolio-changes subscription"
          payload:
            action: UNSUBSCRIBE
            type: ACCOUNT
            data:
              account_id: "1812243"
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
        - name: UnsubscribeAll
          summary: "Close all subscriptions"
          payload:
            action: UNSUBSCRIBE_ALL
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"

    wsEnvelope:
      name: WsEnvelope
      payload:
        type: object
        required:
          - type
          - timestamp
        properties:
          type:
            type: string
            enum:
              - DATA
              - ERROR
              - EVENT
            description: "Message type"
          subscription_key:
            type: string
            description: "Optional subscription identifier (when applicable)"
          subscription_type:
            $ref: "#/components/schemas/SubscriptionType"
          timestamp:
            type: number
            description: "Unix timestamp in seconds with a fractional subsecond part"
          payload:
            description: "Payload (shape depends on subscription_type)"
            oneOf:
              - $ref: "#/components/schemas/SubscribeQuoteResponse"
              - $ref: "#/components/schemas/SubscribeOrderBookResponse"
              - $ref: "#/components/schemas/SubscribeLatestTradesResponse"
              - $ref: "#/components/schemas/SubscribeBarsResponse"
              - $ref: "#/components/schemas/SubscribeOrdersResponse"
              - $ref: "#/components/schemas/SubscribeTradesResponse"
              - $ref: "#/components/schemas/SubscribeAccountResponse"
          error_info:
            $ref: "#/components/schemas/WsError"
          event_info:
            $ref: "#/components/schemas/WsEvent"

  schemas:
    SubscriptionType:
      type: string
      enum:
        - ORDERS
        - TRADES
        - QUOTES
        - ORDER_BOOK
        - BARS
        - INSTRUMENT_TRADES
        - ACCOUNT
      description: "Subscription type"

    WsError:
      type: object
      required:
        - code
        - type
      properties:
        code:
          type: integer
          description: "Error code"
        type:
          type: string
          description: "Error type (e.g. INVALID_REQUEST, UNAUTHENTICATED)"
        message:
          type: string
          description: "Detailed error message (optional)"

    WsEvent:
      type: object
      required:
        - event
        - code
        - reason
      properties:
        event:
          type: string
          description: "Event identifier (e.g. HANDSHAKE_SUCCESS, CONNECTION_CLOSED)"
        code:
          type: integer
          description: "Numeric event code"
        reason:
          type: string
          description: "Event description"

    SubscribeQuoteResponse:
      type: object
      properties:
        quote:
          type: array
          items:
            $ref: "#/components/schemas/Quote"
        error:
          $ref: "#/components/schemas/StreamError"

    StreamError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        description:
          type: string
    Timestamp:
      type: string
      format: date-time
      description: "RFC3339 timestamp"
    Decimal:
      type: object
      description: "Decimal value represented by protobuf google.type.Decimal"
      properties:
        value:
          type: string
          description: "Decimal value encoded as a string to avoid precision loss"

    Quote:
      type: object
      properties:
        symbol:
          type: string
        timestamp:
          $ref: "#/components/schemas/Timestamp"
        ask:
          $ref: "#/components/schemas/Decimal"
        askSize:
          $ref: "#/components/schemas/Decimal"
        bid:
          $ref: "#/components/schemas/Decimal"
        bidSize:
          $ref: "#/components/schemas/Decimal"
        last:
          $ref: "#/components/schemas/Decimal"
        lastSize:
          $ref: "#/components/schemas/Decimal"
        volume:
          $ref: "#/components/schemas/Decimal"
        turnover:
          $ref: "#/components/schemas/Decimal"
        open:
          $ref: "#/components/schemas/Decimal"
        high:
          $ref: "#/components/schemas/Decimal"
        low:
          $ref: "#/components/schemas/Decimal"
        close:
          $ref: "#/components/schemas/Decimal"
        change:
          $ref: "#/components/schemas/Decimal"
        openInterest:
          $ref: "#/components/schemas/Decimal"
          description: "Open interest. Total number of outstanding (active) derivative contracts."
        isDataSnapshot:
          type: boolean
          description: "Indicates whether this message is a snapshot"
        option:
          type: object
          properties:
            openInterest:
              $ref: "#/components/schemas/Decimal"
            impliedVolatility:
              $ref: "#/components/schemas/Decimal"
            theoreticalPrice:
              $ref: "#/components/schemas/Decimal"
            delta:
              $ref: "#/components/schemas/Decimal"
            gamma:
              $ref: "#/components/schemas/Decimal"
            theta:
              $ref: "#/components/schemas/Decimal"
            vega:
              $ref: "#/components/schemas/Decimal"
            rho:
              $ref: "#/components/schemas/Decimal"
    SubscribeOrderBookResponse:
      type: object
      properties:
        orderBook:
          type: array
          items:
            $ref: "#/components/schemas/StreamOrderBook"

    StreamOrderBook:
      type: object
      properties:
        symbol:
          type: string
        rows:
          type: array
          items:
            type: object
            properties:
              price:
                $ref: "#/components/schemas/Decimal"
              sellSize:
                $ref: "#/components/schemas/Decimal"
              buySize:
                $ref: "#/components/schemas/Decimal"
              action:
                type: string
                enum:
                  - ACTION_UNSPECIFIED
                  - ACTION_REMOVE
                  - ACTION_ADD
                  - ACTION_UPDATE
              mpid:
                type: string
              timestamp:
                $ref: "#/components/schemas/Timestamp"
        isDataSnapshot:
          type: boolean
          description: "Indicates whether this message is a snapshot"

    SubscribeLatestTradesResponse:
      type: object
      properties:
        symbol:
          type: string
        trades:
          type: array
          items:
            $ref: "#/components/schemas/Trade"

    Trade:
      type: object
      properties:
        tradeId:
          type: string
        mpid:
          type: string
        timestamp:
          $ref: "#/components/schemas/Timestamp"
        price:
          $ref: "#/components/schemas/Decimal"
        size:
          $ref: "#/components/schemas/Decimal"
        side:
          type: string
          enum:
            - SIDE_UNSPECIFIED
            - SIDE_BUY
            - SIDE_SELL
        openInterest:
          $ref: "#/components/schemas/Decimal"
          description: "Open interest at the time of the transaction."
        isDataSnapshot:
          type: boolean
          description: "Indicates whether this message is a snapshot"

    SubscribeBarsResponse:
      type: object
      properties:
        symbol:
          type: string
        bars:
          type: array
          items:
            $ref: "#/components/schemas/Bar"

    Bar:
      type: object
      properties:
        timestamp:
          $ref: "#/components/schemas/Timestamp"
        open:
          $ref: "#/components/schemas/Decimal"
        high:
          $ref: "#/components/schemas/Decimal"
        low:
          $ref: "#/components/schemas/Decimal"
        close:
          $ref: "#/components/schemas/Decimal"
        volume:
          $ref: "#/components/schemas/Decimal"
        isDataSnapshot:
          type: boolean
          description: "Indicates whether this message is a snapshot"

    SubscribeOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderState"

    OrderState:
      type: object
      properties:
        orderId:
          type: string
        execId:
          type: string
        status:
          type: string
          enum:
            - ORDER_STATUS_UNSPECIFIED
            - ORDER_STATUS_NEW
            - ORDER_STATUS_PARTIALLY_FILLED
            - ORDER_STATUS_FILLED
            - ORDER_STATUS_DONE_FOR_DAY
            - ORDER_STATUS_CANCELED
            - ORDER_STATUS_REPLACED
            - ORDER_STATUS_PENDING_CANCEL
            - ORDER_STATUS_REJECTED
            - ORDER_STATUS_SUSPENDED
            - ORDER_STATUS_PENDING_NEW
            - ORDER_STATUS_EXPIRED
            - ORDER_STATUS_FAILED
            - ORDER_STATUS_FORWARDING
            - ORDER_STATUS_WAIT
            - ORDER_STATUS_DENIED_BY_BROKER
            - ORDER_STATUS_REJECTED_BY_EXCHANGE
            - ORDER_STATUS_WATCHING
            - ORDER_STATUS_EXECUTED
            - ORDER_STATUS_DISABLED
            - ORDER_STATUS_LINK_WAIT
            - ORDER_STATUS_SL_GUARD_TIME
            - ORDER_STATUS_SL_EXECUTED
            - ORDER_STATUS_SL_FORWARDING
            - ORDER_STATUS_TP_GUARD_TIME
            - ORDER_STATUS_TP_EXECUTED
            - ORDER_STATUS_TP_CORRECTION
            - ORDER_STATUS_TP_FORWARDING
            - ORDER_STATUS_TP_CORR_GUARD_TIME
        order:
          $ref: "#/components/schemas/Order"
        transactAt:
          $ref: "#/components/schemas/Timestamp"
        acceptAt:
          $ref: "#/components/schemas/Timestamp"
        withdrawAt:
          $ref: "#/components/schemas/Timestamp"
        initialQuantity:
          $ref: "#/components/schemas/Decimal"
          description: "Initial quantity (populated only for exchange orders)"
        executedQuantity:
          $ref: "#/components/schemas/Decimal"
          description: "Executed volume (populated only for exchange orders)"
        remainingQuantity:
          $ref: "#/components/schemas/Decimal"
          description: "Remaining quantity (populated only for exchange orders)"
        sltpOrder:
          $ref: "#/components/schemas/SLTPOrder"
        triggeredOrderId:
          type: string
          description: "ID of the exchange order generated once a condition or stop price was triggered"
        statusDescription:
          type: string
          description: "Order status description"

    Order:
      type: object
      properties:
        accountId:
          type: string
        symbol:
          type: string
        quantity:
          $ref: "#/components/schemas/Decimal"
        side:
          type: string
          enum:
            - SIDE_UNSPECIFIED
            - SIDE_BUY
            - SIDE_SELL
        type:
          type: string
          enum:
            - ORDER_TYPE_UNSPECIFIED
            - ORDER_TYPE_MARKET
            - ORDER_TYPE_LIMIT
            - ORDER_TYPE_STOP
            - ORDER_TYPE_STOP_LIMIT
            - ORDER_TYPE_MULTI_LEG
        timeInForce:
          type: string
          enum:
            - TIME_IN_FORCE_UNSPECIFIED
            - TIME_IN_FORCE_DAY
            - TIME_IN_FORCE_GOOD_TILL_CANCEL
            - TIME_IN_FORCE_GOOD_TILL_CROSSING
            - TIME_IN_FORCE_EXT
            - TIME_IN_FORCE_ON_OPEN
            - TIME_IN_FORCE_ON_CLOSE
            - TIME_IN_FORCE_IOC
            - TIME_IN_FORCE_FOK
        limitPrice:
          $ref: "#/components/schemas/Decimal"
        stopPrice:
          $ref: "#/components/schemas/Decimal"
        stopCondition:
          type: string
          enum:
            - STOP_CONDITION_UNSPECIFIED
            - STOP_CONDITION_LAST_UP
            - STOP_CONDITION_LAST_DOWN
        legs:
          type: array
          items:
            $ref: "#/components/schemas/Leg"
        clientOrderId:
          type: string
        validBefore:
          type: string
          enum:
            - VALID_BEFORE_UNSPECIFIED
            - VALID_BEFORE_END_OF_DAY
            - VALID_BEFORE_GOOD_TILL_CANCEL
            - VALID_BEFORE_GOOD_TILL_DATE
        comment:
          type: string

    Leg:
      type: object
      properties:
        symbol:
          type: string
        quantity:
          $ref: "#/components/schemas/Decimal"
        side:
          type: string
          enum:
            - SIDE_UNSPECIFIED
            - SIDE_BUY
            - SIDE_SELL

    SLTPOrder:
      type: object
      description: "SL/TP order details, populated on OrderState when the order is a stop-loss/take-profit order"
      properties:
        accountId:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum:
            - SIDE_UNSPECIFIED
            - SIDE_BUY
            - SIDE_SELL
        quantitySl:
          $ref: "#/components/schemas/Decimal"
        slPrice:
          $ref: "#/components/schemas/Decimal"
        limitPrice:
          $ref: "#/components/schemas/Decimal"
        quantityTp:
          $ref: "#/components/schemas/Decimal"
        tpPrice:
          $ref: "#/components/schemas/Decimal"
        tpGuardSpread:
          $ref: "#/components/schemas/Decimal"
        tpSpreadMeasure:
          type: string
          enum:
            - TP_SPREAD_MEASURE_UNDEFINED
            - TP_SPREAD_MEASURE_VALUE
            - TP_SPREAD_MEASURE_PERCENT
        clientOrderId:
          type: string
        validBefore:
          type: string
          enum:
            - VALID_BEFORE_UNSPECIFIED
            - VALID_BEFORE_END_OF_DAY
            - VALID_BEFORE_GOOD_TILL_CANCEL
            - VALID_BEFORE_GOOD_TILL_DATE
        validExpiryTime:
          $ref: "#/components/schemas/Timestamp"
        comment:
          type: string
        slQtyMeasure:
          type: string
          description: "If SLTP_QTY_MEASURE_PERCENT, quantitySl is a percentage (0-100) of the position at execution time."
          enum:
            - SLTP_QTY_MEASURE_UNDEFINED
            - SLTP_QTY_MEASURE_VALUE
            - SLTP_QTY_MEASURE_PERCENT
        tpQtyMeasure:
          type: string
          description: "If SLTP_QTY_MEASURE_PERCENT, quantityTp is a percentage (0-100) of the position at execution time."
          enum:
            - SLTP_QTY_MEASURE_UNDEFINED
            - SLTP_QTY_MEASURE_VALUE
            - SLTP_QTY_MEASURE_PERCENT
        slGuardTime:
          type: integer
          description: "StopLoss guard time, in seconds."
        tpGuardTime:
          type: integer
          description: "TakeProfit guard time, in seconds."

    SubscribeTradesResponse:
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: "#/components/schemas/AccountTrade"

    AccountTrade:
      type: object
      properties:
        tradeId:
          type: string
        symbol:
          type: string
        price:
          $ref: "#/components/schemas/Decimal"
        size:
          $ref: "#/components/schemas/Decimal"
        side:
          type: string
          enum:
            - SIDE_UNSPECIFIED
            - SIDE_BUY
            - SIDE_SELL
        timestamp:
          $ref: "#/components/schemas/Timestamp"
        orderId:
          type: string
        accountId:
          type: string
        comment:
          type: string
        accruedInterest:
          $ref: "#/components/schemas/Decimal"
          description: "Accrued interest, filled the next day after the trade date"
        currency:
          type: string
          description: "Price currency; may be empty for trades received from a subscription"
        commission:
          $ref: "#/components/schemas/Commission"
          description: "Commission, filled for historical trades"

    Commission:
      type: object
      properties:
        value:
          $ref: "#/components/schemas/Decimal"
        currency:
          type: string

    SubscribeAccountResponse:
      type: object
      properties:
        accountId:
          type: string
        type:
          type: string
        status:
          type: string
        equity:
          $ref: "#/components/schemas/Decimal"
        unrealizedProfit:
          $ref: "#/components/schemas/Decimal"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        cash:
          type: array
          items:
            $ref: "#/components/schemas/Money"

        portfolioMct:
          description: "Portfolio type for accounts in US markets."
          oneOf:
            - $ref: "#/components/schemas/MCT"

        openAccountDate:
          $ref: "#/components/schemas/Timestamp"
        firstTradeDate:
          $ref: "#/components/schemas/Timestamp"
        firstNonTradeDate:
          $ref: "#/components/schemas/Timestamp"


    MCT:
      type: object
      description: "Portfolio type for accounts on US markets. Provides access to US exchanges: NYSE, NASDAQ, CBOE, CME; trades in US stocks, futures, and options."

    Position:
      type: object
      properties:
        symbol:
          type: string
        quantity:
          $ref: "#/components/schemas/Decimal"
        averagePrice:
          $ref: "#/components/schemas/Decimal"
        currentPrice:
          $ref: "#/components/schemas/Decimal"
        maintenanceMargin:
          $ref: "#/components/schemas/Decimal"
        dailyPnl:
          $ref: "#/components/schemas/Decimal"
        unrealizedPnl:
          $ref: "#/components/schemas/Decimal"
        currentPriceCurrency:
          type: string
          description: "Currency code of currentPrice"
        averagePriceCurrency:
          type: string
          description: "Currency code of averagePrice"

    Money:
      type: object
      description: Monetary amount (google.type.Money)
      properties:
        currencyCode:
          type: string
          example: USD
        units:
          type: string
        nanos:
          type: integer

  securitySchemes:
    AuthorizationHeader:
      type: httpApiKey
      in: header
      name: Authorization
      description: "The JWT is passed directly in the Authorization HTTP header. Example: Authorization: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9.TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ"
    TokenInPayload:
      type: plain
      x-in: payload
      description: "The JWT is passed in the subscription request body. See the `SubscribeBars` example."
