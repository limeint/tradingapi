syntax = "proto3";

package grpc.tradeapi.v1.accounts;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/type/decimal.proto";
import "google/type/interval.proto";
import "google/type/money.proto";
import "grpc/tradeapi/v1/side.proto";
import "grpc/tradeapi/v1/trade.proto";
import "grpc/gateway/protoc_gen_openapiv2/options/annotations.proto";

option go_package = "github.com/limeint/tradingapi/go/grpc/tradeapi/v1/accounts";
option java_multiple_files = true;
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  schemes: [
    HTTP,
    HTTPS
  ]
  info: {
    title: "Limeint Trade API"
    description: "Limeint API for trading operations"
  }
  security_definitions: {
    security: {
      key: "Authorization"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT authorization token"
      }
    }
  }
  responses: [
    {
      key: "default"
      value: {
        schema: {
          json_schema: {
            ref: "googletypeStatus"
          }
        }
      }
    },
    {
      key: "500"
      value: {
        description: "Internal service error. Try again later."
      }
    },
    {
      key: "503"
      value: {
        description: "The service is currently unavailable. Try again later."
      }
    },
    {
      key: "429"
      value: {
        description: "Too many requests. The available limit is 200 requests per minute."
      }
    },
    {
      key: "401"
      value: {
        description: "The token has expired or is invalid."
      }
    },
    {
      key: "504"
      value: {
        description: "The deadline was exceeded before the operation completed."
      }
    },
    {
      key: "404"
      value: {
        description: "Account was not found in token"
      }
    }
  ]
};

// Account service
service AccountsService {
  // Get information about a specific account
  // Example HTTP request:
  // GET /v1/accounts/A12345
  // Authorization: <token>
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option (google.api.http) = {
      get: "/v1/accounts/{account_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: [
        {
          security_requirement: {
            key: "Authorization"
          }
        }
      ]
    };
  };

  // Get account trade history
  // Example HTTP request:
  // GET /v1/accounts/A12345/trades?limit=50&interval.start_time=2023-01-01T00:00:00Z&interval.end_time=2023-01-31T23:59:59Z
  // Authorization: <token>
  //
  // Parameters:
  // - account_id is passed in the URL path
  // - limit and interval are passed as query parameters
  rpc Trades(TradesRequest) returns (TradesResponse) {
    option (google.api.http) = {
      get: "/v1/accounts/{account_id}/trades"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: [
        {
          security_requirement: {
            key: "Authorization"
          }
        }
      ]
      responses: {
        key: "400"
        value: {
          description: "Invalid interval"
        }
      }
    };
  };

  // Get account transactions
  // Example HTTP request:
  // GET /v1/accounts/A12345/transactions?limit=50&interval.start_time=2023-01-01T00:00:00Z&interval.end_time=2023-01-31T23:59:59Z
  // Authorization: <token>
  //
  // Parameters:
  // - account_id is passed in the URL path
  // - limit and interval are passed as query parameters
  rpc Transactions(TransactionsRequest) returns (TransactionsResponse) {
    option (google.api.http) = {
      get: "/v1/accounts/{account_id}/transactions"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: [
        {
          security_requirement: {
            key: "Authorization"
          }
        }
      ]
      responses: {
        key: "400"
        value: {
          description: "Invalid interval"
        }
      }
    };
  };

  // Subscribe to account information. Stream method
  rpc SubscribeAccount(GetAccountRequest) returns (stream GetAccountResponse);

}

// Request information for a specific account
message GetAccountRequest {
  // Account ID
  string account_id = 1;
}

// Information about a specific account
message GetAccountResponse {
  // Account ID
  string account_id = 1;
  // Account type
  string type = 2;
  // Account status
  string status = 3;
  // Available funds plus cost of open positions
  google.type.Decimal equity = 4;
  // Unrealized profit
  google.type.Decimal unrealized_profit = 5;
  // Open positions plus theoretical positions from unfilled active orders
  repeated Position positions = 6;
  // The amount of own funds in the account available for trading. Does not include margin funds.
  repeated google.type.Money cash = 7;

  oneof portfolio {
    // General type for Moscow Exchange accounts. Includes both single and mono accounts.
    MC portfolio_mc = 8;
    // Portfolio type for US markets accounts.
    MCT portfolio_mct = 9;
    // Portfolio type for trading on the derivatives market of the Moscow Exchange.
    FORTS portfolio_forts = 10;
  }
  // Account opening date
  google.protobuf.Timestamp open_account_date = 11;
  // Date of first trade transaction
  google.protobuf.Timestamp first_trade_date = 12;
  // Date of first non-trading transaction
  google.protobuf.Timestamp first_non_trade_date = 13;
}

// General type for Moscow Exchange accounts. Includes both single and specialized (mono) accounts for different sections of the exchange.
// Unified Trading Account (UTA): supports several markets (equities, FX, derivatives, SPB, foreign securities, and foreign futures) with a single cash position.
// MOEX equities mono account: isolated account for trading stocks, bonds, and fund units.
// MOEX FX mono account: isolated account for currency-pair transactions (for example, CNYRUB_TOM).
message MC {
  // The amount of own funds in the account available for trading. Includes margin funds.
  google.type.Decimal available_cash = 1;
  // Initial Margin
  google.type.Decimal initial_margin = 2;
  // Minimum Margin
  google.type.Decimal maintenance_margin = 3;
}

// Portfolio type for US markets accounts.
// Provides access to US exchanges: NYSE, NASDAQ, CBOE, CME, trade with US stocks, futures and options.
message MCT {
}

// Portfolio type for trading on the derivatives market of the Moscow Exchange.
// Designed to work with derivative financial instruments: futures and options.
message FORTS {
  // The amount of own funds in the account available for trading. Includes margin funds.
  google.type.Decimal available_cash = 1;
  // Minimum margin (required amount of collateral for open positions)
  google.type.Decimal money_reserved = 2;
}

// Request for trade history
message TradesRequest {
  // Account ID
  string account_id = 1;
  // Maximum number of trades
  int32 limit = 2;
  // Start and end of the requested period, Unix epoch time
  google.type.Interval interval = 3;
}

// Trade history
message TradesResponse {
  // Account trades
  repeated AccountTrade trades = 1;
}

// Request for a list of transactions
message TransactionsRequest {
  // Account ID
  string account_id = 1;
  // Transaction limit
  int32 limit = 2;
  // Start and end of the requested period, Unix epoch time
  google.type.Interval interval = 3;
}

// List of transactions
message TransactionsResponse {
  // Account transactions
  repeated Transaction transactions = 1;
}

// Position information
message Position {
  // Instrument symbol
  string symbol = 1;
  // Quantity in units, signed value (long-short)
  google.type.Decimal quantity = 2;
  // Average price, not populated for FORTS positions
  google.type.Decimal average_price = 3;
  // Current price
  google.type.Decimal current_price = 4;
  // Maintenance margin, populated only for FORTS positions
  google.type.Decimal maintenance_margin = 5;
  // Profit or loss for the current day (PnL), not populated for FORTS positions
  google.type.Decimal daily_pnl = 6;
  // Total unrealized profit or loss (PnL) of the current position
  google.type.Decimal unrealized_pnl = 7;
}

// Transaction information
message Transaction {
  // Populated for trade-related transaction types
  message Trade {
    // Quantity in units
    google.type.Decimal size = 1;
    // Trade price per unit. For options, this is the execution price or premium reported by the trade.
    google.type.Decimal price = 2;
    // Accrued interest, populated when the trade includes accrued interest
    google.type.Decimal accrued_interest = 3;
  }
  // Transaction categories.
  enum TransactionCategory {
    // Other
    OTHERS = 0;
    // Cash deposit
    DEPOSIT = 1;
    // Cash withdrawal
    WITHDRAW = 2;
    // Income
    INCOME = 5;
    // Commission
    COMMISSION = 7;
    // Tax
    TAX = 8;
    // Inheritance
    INHERITANCE = 9;
    // Cash transfer
    TRANSFER = 11;
    // Termination of the contract
    CONTRACT_TERMINATION = 12;
    // Expenses
    OUTCOMES = 13;
    // Fine
    FINE = 15;
    // Loan
    LOAN = 19;
  }
  // Transaction ID
  string id = 1;
  // Transaction type from TransactionCategory
  string category = 2 [deprecated = true];
  // Timestamp
  google.protobuf.Timestamp timestamp = 4;
  // Instrument symbol
  string symbol = 5;
  // Change in money
  google.type.Money change = 6;
  // Trade information
  Trade trade = 7;
  // Transaction category from TransactionCategory.
  TransactionCategory transaction_category = 8;
  // Transaction name
  string transaction_name = 9;
  // Quantity change, populated only for securities transfers (TransactionCategory = TRANSFER)
  google.type.Decimal change_qty = 10;
}
