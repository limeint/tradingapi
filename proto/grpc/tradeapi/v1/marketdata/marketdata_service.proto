syntax = "proto3";

package grpc.tradeapi.v1.marketdata;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/type/decimal.proto";
import "google/type/interval.proto";
import "grpc/tradeapi/v1/side.proto";
import "grpc/gateway/protoc_gen_openapiv2/options/annotations.proto";

option go_package = "github.com/limeint/tradingapi/go/grpc/tradeapi/v1/marketdata";
option java_multiple_files = true;
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  schemes: [
    HTTP,
    HTTPS
  ]
  info: {
    title: "Limeint Trade API"
    description: "Limeint API for trading operations"
  }
  security_definitions: {
    security: {
      key: "Authorization"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT authorization token"
      }
    }
  }
  responses: [
    {
      key: "default"
      value: {
        schema: {
          json_schema: {
            ref: "googletypeStatus"
          }
        }
      }
    },
    {
      key: "500"
      value: {
        description: "Internal service error. Try again later."
      }
    },
    {
      key: "503"
      value: {
        description: "The service is currently unavailable. Try again later."
      }
    },
    {
      key: "429"
      value: {
        description: "Too many requests. The available limit is 200 requests per minute."
      }
    },
    {
      key: "401"
      value: {
        description: "The token has expired or is invalid."
      }
    },
    {
      key: "504"
      value: {
        description: "The deadline was exceeded before the operation completed."
      }
    },
    {
      key: "404"
      value: {
        description: "Instrument not found"
      }
    },
    {
      key: "400"
      value: {
        description: "Invalid symbol. The symbol must use ticker@mic format, for example SBER@MISX."
      }
    }
  ]
};

// Market data service
service MarketDataService {
  // Get historical bars for an instrument
  // Example HTTP request:
  // GET /v1/instruments/SBER@MISX/bars?timeframe=TIME_FRAME_D&interval.start_time=2023-01-01T00:00:00Z&interval.end_time=2023-01-31T23:59:59Z
  // Authorization: <token>
  //
  // Parameters:
  // - symbol is passed in the URL path
  // - timeframe and interval are passed as query parameters
  rpc Bars(BarsRequest) returns (BarsResponse) {
    option (google.api.http) = {
      get: "/v1/instruments/{symbol}/bars"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: [
        {
          security_requirement: {
            key: "Authorization"
          }
        }
      ]
      responses: {
        key: "400"
        value: {
          description: "Invalid symbol or interval. The symbol must use ticker@mic format, for example SBER@MISX."
        }
      }
    };
  };

  // Get the latest quote for an instrument
  // Example HTTP request:
  // GET /v1/instruments/SBER@MISX/quotes/latest
  // Authorization: <token>
  rpc LastQuote(QuoteRequest) returns (QuoteResponse) {
    option (google.api.http) = {
      get: "/v1/instruments/{symbol}/quotes/latest"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: [
        {
          security_requirement: {
            key: "Authorization"
          }
        }
      ]
    };
  };

  // Get the current order book for an instrument
  // Example HTTP request:
  // GET /v1/instruments/SBER@MISX/orderbook
  // Authorization: <token>
  rpc OrderBook(OrderBookRequest) returns (OrderBookResponse) {
    option (google.api.http) = {
      get: "/v1/instruments/{symbol}/orderbook"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: [
        {
          security_requirement: {
            key: "Authorization"
          }
        }
      ]
    };
  };

  // Get recent trades for an instrument
  // Example HTTP request:
  // GET /v1/instruments/SBER@MISX/trades/latest
  // Authorization: <token>
  rpc LatestTrades(LatestTradesRequest) returns (LatestTradesResponse) {
    option (google.api.http) = {
      get: "/v1/instruments/{symbol}/trades/latest"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: [
        {
          security_requirement: {
            key: "Authorization"
          }
        }
      ]
    };
  };

  // Subscribe to quotes for an instrument. Stream method
  rpc SubscribeQuote(SubscribeQuoteRequest) returns (stream SubscribeQuoteResponse);

  // Subscribe to an instrument's order book. Stream method
  rpc SubscribeOrderBook(SubscribeOrderBookRequest) returns (stream SubscribeOrderBookResponse);

  // Subscribe to trades for an instrument. Stream method
  rpc SubscribeLatestTrades(SubscribeLatestTradesRequest) returns (stream SubscribeLatestTradesResponse);

  // Subscribe to aggregated bars. Stream method
  rpc SubscribeBars(SubscribeBarsRequest) returns (stream SubscribeBarsResponse);

}

// Available bar timeframes
enum TimeFrame {
  // Timeframe not specified
  TIME_FRAME_UNSPECIFIED = 0;
  // 1 minute. Data depth 7 days.
  TIME_FRAME_M1 = 1;
  // 5 minutes. Data depth 30 days.
  TIME_FRAME_M5 = 5;
  // 15 minutes. Data depth 30 days.
  TIME_FRAME_M15 = 9;
  // 30 minutes. Data depth 30 days.
  TIME_FRAME_M30 = 11;
  // 1 hour. Data depth 30 days.
  TIME_FRAME_H1 = 12;
  // 2 hours. Data depth 30 days.
  TIME_FRAME_H2 = 13;
  // 4 hours. Data depth 30 days.
  TIME_FRAME_H4 = 15;
  // 8 hours. Data depth 30 days.
  TIME_FRAME_H8 = 17;
  // Day. Data depth 365 days.
  TIME_FRAME_D = 19;
  // Week. Data depth 365*5 days.
  TIME_FRAME_W = 20;
  // Month. Data depth 365*5 days.
  TIME_FRAME_MN = 21;
  // Quarter. Data depth 365*5 days.
  TIME_FRAME_QR = 22;
}

// Request historical bars for an instrument
message BarsRequest {
  // Instrument symbol
  string symbol = 1;
  // Required timeframe
  TimeFrame timeframe = 2;
  // Start and end of the requested period
  google.type.Interval interval = 3;
}

// List of aggregated bars
message BarsResponse {
  // Instrument symbol
  string symbol = 1;
  // Aggregated bars
  repeated Bar bars = 2;
}

// Request to receive the latest quote for an instrument
message QuoteRequest {
  // Instrument symbol
  string symbol = 1;
}

// Latest quote for the instrument
message QuoteResponse {
  // Instrument symbol
  string symbol = 1;
  // Last trade price
  Quote quote = 2;
}

// Request the current order book for an instrument
message OrderBookRequest {
  // Instrument symbol
  string symbol = 1;
}

// Current order book by instrument
message OrderBookResponse {
  // Instrument symbol
  string symbol = 1;
  // Order book
  OrderBook orderbook = 2;
}

// Request recent trades for an instrument
message LatestTradesRequest {
  // Instrument symbol
  string symbol = 1;
}

// Recent trades for an instrument
message LatestTradesResponse {
  // Instrument symbol
  string symbol = 1;
  // Recent trades
  repeated Trade trades = 2;
}

// Request to subscribe to quotes for an instrument. Stream
message SubscribeQuoteRequest {
  // List of instrument symbols
  repeated string symbols = 1;
}

// Quotes by instrument. Stream
message SubscribeQuoteResponse {
  // List of quotes
  repeated Quote quote = 1;
  // Stream service error
  StreamError error = 2;
}

// Request for subscription to order book by instrument. Stream
message SubscribeOrderBookRequest {
  // Instrument symbol
  string symbol = 1;
}

// Instrument order book stream
message SubscribeOrderBookResponse {
  // List of order book streams
  repeated StreamOrderBook order_book = 1;
}

// Request an aggregated-bar subscription. Stream
message SubscribeBarsRequest {
  // Instrument symbol
  string symbol = 1;
  // Required timeframe
  TimeFrame timeframe = 2;
}

// Aggregated bars. Stream
message SubscribeBarsResponse {
  // Instrument symbol
  string symbol = 1;
  // Aggregated bars
  repeated Bar bars = 2;
}

// Aggregated bar information
message Bar {
  // Timestamp
  google.protobuf.Timestamp timestamp = 1;
  // Opening price
  google.type.Decimal open = 2;
  // High price
  google.type.Decimal high = 3;
  // Low price
  google.type.Decimal low = 4;
  // Closing price
  google.type.Decimal close = 5;
  // Trading volume for the bar, in units
  google.type.Decimal volume = 6;
}

// Quote information
message Quote {
  // Option Information
  message Option {
    // Open Interest
    google.type.Decimal open_interest = 1;
    // Implied volatility
    google.type.Decimal implied_volatility = 2;
    // Theoretical price
    google.type.Decimal theoretical_price = 3;
    // Delta
    google.type.Decimal delta = 4;
    // Gamma
    google.type.Decimal gamma = 5;
    // Theta
    google.type.Decimal theta = 6;
    // Vega
    google.type.Decimal vega = 7;
    // Rho
    google.type.Decimal rho = 8;
  }
  // Instrument symbol
  string symbol = 1;
  // Timestamp
  google.protobuf.Timestamp timestamp = 2;
  // Ask. 0 if there is no active ask
  google.type.Decimal ask = 3;
  // Ask size
  google.type.Decimal ask_size = 4;
  // Bid. 0 if there is no active bid
  google.type.Decimal bid = 5;
  // Bid size
  google.type.Decimal bid_size = 6;
  // Last trade price
  google.type.Decimal last = 7;
  // Last trade size
  google.type.Decimal last_size = 8;
  // Daily trade volume
  google.type.Decimal volume = 9;
  // Daily trade turnover
  google.type.Decimal turnover = 10;
  // Opening price. Daytime
  google.type.Decimal open = 11;
  // Maximum price. Daytime
  google.type.Decimal high = 12;
  // Minimum price. Daytime
  google.type.Decimal low = 13;
  // Closing price. Daytime
  google.type.Decimal close = 14;
  // Price change (last minus close)
  google.type.Decimal change = 15;
  // Open interest. The total number of open (active) derivative contracts.
  google.type.Decimal open_interest = 16;

  oneof additions {
    // Option Information
    Option option = 50;
  }
}

// Order book information
message OrderBook {
  // Information about the level in the order book (line)
  message Row {
    // Action
    enum Action {
      // Action not specified
      ACTION_UNSPECIFIED = 0;
      // Delete
      ACTION_REMOVE = 1;
      // Add
      ACTION_ADD = 2;
      // Update
      ACTION_UPDATE = 3;
    }
    // Price
    google.type.Decimal price = 1;

    oneof side {
      // Sell size
      google.type.Decimal sell_size = 2;
      // Buy size
      google.type.Decimal buy_size = 3;
    }
    // Action
    Action action = 4;
    // Market Participant ID
    string mpid = 5;
    // Timestamp
    google.protobuf.Timestamp timestamp = 6;
  }
  // Order book levels
  repeated Row rows = 1;
}

// Trade information
message Trade {
  // Trade ID sent by the exchange
  string trade_id = 1;
  // Market Participant ID
  string mpid = 2;
  // Timestamp
  google.protobuf.Timestamp timestamp = 3;
  // Trade price
  google.type.Decimal price = 4;
  // Trade size
  google.type.Decimal size = 5;
  // Trade side (buy or sell)
  Side side = 6;
  // Open interest at the time of the trade.
  google.type.Decimal open_interest = 7;
}

// Stream service error
message StreamError {
  // Error code
  int32 code = 1;
  // Description of the error
  string description = 2;
}

// Instrument order book stream
message StreamOrderBook {
  // Information about the level in the order book (line)
  message Row {
    // Action
    enum Action {
      // Action not specified
      ACTION_UNSPECIFIED = 0;
      // Delete
      ACTION_REMOVE = 1;
      // Add
      ACTION_ADD = 2;
      // Update
      ACTION_UPDATE = 3;
    }
    // Price
    google.type.Decimal price = 1;

    oneof side {
      // Sell size
      google.type.Decimal sell_size = 2;
      // Buy size
      google.type.Decimal buy_size = 3;
    }
    // Action
    Action action = 4;
    // Market Participant ID
    string mpid = 5;
    // Timestamp
    google.protobuf.Timestamp timestamp = 6;
  }
  // Instrument symbol
  string symbol = 1;
  // Order book levels
  repeated Row rows = 2;
}

// Request recent trades for an instrument. Stream
message SubscribeLatestTradesRequest {
  // Instrument symbol
  string symbol = 1;
}

// Recent trades for an instrument. Stream
message SubscribeLatestTradesResponse {
  // Instrument symbol
  string symbol = 1;
  // List of trades
  repeated Trade trades = 2;
}
