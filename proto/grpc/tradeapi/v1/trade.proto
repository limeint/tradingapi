syntax = "proto3";

package grpc.tradeapi.v1;

import "google/protobuf/timestamp.proto";
import "google/type/decimal.proto";
import "grpc/tradeapi/v1/side.proto";

option go_package = "github.com/limeint/tradingapi/go/grpc/tradeapi/v1";
option java_multiple_files = true;

// Trade Information
message AccountTrade {
  // Trade ID
  string trade_id = 1;
  // Asset symbol
  string symbol = 2;
  // Trade Price
  google.type.Decimal price = 3;
  // Size in pcs.
  google.type.Decimal size = 4;
  // Trading side (long or short)
  Side side = 5;
  // Timestamp
  google.protobuf.Timestamp timestamp = 6;
  // Order ID
  string order_id = 7;
  // Account ID
  string account_id = 8;
  // Order Label (maximum 128 characters)
  string comment = 9;
  // Accrued interest (filled the next day after the trade date)
  google.type.Decimal accrued_interest = 10;
  // Price currency (for example, USD, EUR)
  // Note: The field is filled in only when using the Trades method
  // For SubscribeTrades, this field may be empty due to differences in data sources. When processing trades from a subscription, it is recommended to consider the possibility of an empty value.
  string currency = 11;
}

